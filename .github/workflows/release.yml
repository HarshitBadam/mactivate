name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version from the immutable release tag"
        required: true
        type: string
      homebrew_only:
        description: "Repair Homebrew from an existing published release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    if: ${{ !inputs.homebrew_only }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            mactivate
            homebrew-mactivate

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          tag="v$version"

          if [[ "$GITHUB_REF" != "refs/tags/$tag" ]]; then
            echo "Release $version must run from refs/tags/$tag." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Version must be semantic, for example 1.0.1." >&2
            exit 1
          fi

          project_version="$(
            xcodebuild \
              -project app/MactivateApp.xcodeproj \
              -scheme MactivateApp \
              -configuration Release \
              -showBuildSettings |
              awk '$1 == "MARKETING_VERSION" && $2 == "=" { print $3; exit }'
          )"

          if [[ "$version" != "$project_version" ]]; then
            echo "Requested version $version does not match MARKETING_VERSION $project_version." >&2
            exit 1
          fi

          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "Release $tag must exist as a draft before publication." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "$tag^{}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $tag does not match the checked-out commit." >&2
            exit 1
          fi

          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Build disk image
        run: tools/release/build_dmg.sh "$RELEASE_VERSION"

      - name: Render Homebrew cask
        run: |
          tools/release/render_cask.sh \
            "$RELEASE_VERSION" \
            "build/release/dist/Mactivate-$RELEASE_VERSION.dmg" \
            "build/release/dist/mactivate.rb"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/release/dist/Mactivate-$RELEASE_VERSION.dmg" \
            "build/release/dist/Mactivate-$RELEASE_VERSION.dmg.sha256" \
            "build/release/dist/mactivate.rb" \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          notes="docs/release/notes/$RELEASE_VERSION.md"
          if [[ -f "$notes" ]]; then
            gh release edit \
              "$RELEASE_TAG" \
              --notes-file "$notes" \
              --draft=false \
              --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  homebrew:
    name: Publish Homebrew cask
    needs: publish
    if: ${{ always() && (inputs.homebrew_only || needs.publish.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            mactivate
            homebrew-mactivate

      - name: Validate published artifacts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          tag="v$version"
          release_dir="$RUNNER_TEMP/mactivate-release"
          cask="$release_dir/mactivate.rb"
          checksum="$release_dir/Mactivate-$version.dmg.sha256"
          dmg="$release_dir/Mactivate-$version.dmg"
          mkdir -p "$release_dir"

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mactivate.rb" \
            --pattern "Mactivate-$version.dmg.sha256" \
            --dir "$release_dir"
          curl \
            --fail \
            --location \
            --retry 5 \
            --output "$dmg" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Mactivate-$version.dmg"

          cask_version="$(awk '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' "$cask")"
          cask_sha="$(awk '$1 == "sha256" { gsub(/"/, "", $2); print $2; exit }' "$cask")"
          release_sha="$(awk '{ print $1; exit }' "$checksum")"
          downloaded_sha="$(shasum -a 256 "$dmg" | awk '{ print $1 }')"

          if [[ "$cask_version" != "$version" ]]; then
            echo "Cask version $cask_version does not match release $version." >&2
            exit 1
          fi

          if [[ "$cask_sha" != "$release_sha" || "$cask_sha" != "$downloaded_sha" ]]; then
            echo "Published DMG, checksum, and cask SHA-256 values do not match." >&2
            exit 1
          fi

          validation_tap="mactivate/validation"
          brew tap-new "$validation_tap"
          validation_dir="$(brew --repository "$validation_tap")"
          mkdir -p "$validation_dir/Casks"
          cp "$cask" "$validation_dir/Casks/mactivate.rb"

          brew style --cask "$validation_dir/Casks/mactivate.rb"
          brew audit --cask --online "$validation_tap/mactivate"
          brew install --cask --no-quarantine "$validation_tap/mactivate"
          test -d /Applications/Mactivate.app
          brew uninstall --cask mactivate
          brew untap "$validation_tap"

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAP_REPOSITORY: HarshitBadam/homebrew-mactivate
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="${VERSION_INPUT#v}"
          branch="mactivate-v$version"
          gh auth setup-git
          brew tap HarshitBadam/mactivate
          tap_dir="$(brew --repository HarshitBadam/mactivate)"

          current_version="$(
            awk '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' \
              "$tap_dir/Casks/mactivate.rb"
          )"

          if [[ "$current_version" == "$version" ]]; then
            echo "Homebrew already serves Mactivate $version."
            exit 0
          fi

          ruby -rrubygems -e '
            current = Gem::Version.new(ARGV.fetch(0))
            release = Gem::Version.new(ARGV.fetch(1))
            abort "Refusing to replace #{current} with #{release}." unless release > current
          ' "$current_version" "$version"

          if git -C "$tap_dir" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git -C "$tap_dir" fetch origin "$branch"
            git -C "$tap_dir" checkout -B "$branch" FETCH_HEAD
            git -C "$tap_dir" merge --no-edit origin/main
          else
            git -C "$tap_dir" checkout -b "$branch"
          fi

          cp "$RUNNER_TEMP/mactivate-release/mactivate.rb" "$tap_dir/Casks/mactivate.rb"
          git -C "$tap_dir" config user.name "mactivate-release[bot]"
          git -C "$tap_dir" config user.email "mactivate-release[bot]@users.noreply.github.com"
          git -C "$tap_dir" add Casks/mactivate.rb

          if ! git -C "$tap_dir" diff --cached --quiet; then
            git -C "$tap_dir" commit -m "chore: update Mactivate to $version"
            git -C "$tap_dir" push -u origin "$branch"
          fi

          pr_number="$(
            gh pr list \
              --repo "$TAP_REPOSITORY" \
              --head "$branch" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$TAP_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: update Mactivate to $version" \
              --body "Updates the validated cask for Mactivate $version."
            pr_number="$(
              gh pr list \
                --repo "$TAP_REPOSITORY" \
                --head "$branch" \
                --state open \
                --json number \
                --jq '.[0].number'
            )"
          fi

          head_commit="$(git -C "$tap_dir" rev-parse HEAD)"
          gh pr merge "$pr_number" \
            --repo "$TAP_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_commit"
